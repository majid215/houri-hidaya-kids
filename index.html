<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houri Hidaya kids - متجر الأطفال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b81;
            --secondary-color: #70a1ff;
            --bg-color: #fff9fa;
            --text-color: #2f3542;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .announcement {
            background: linear-gradient(90deg, #ff6b81, #ff4757);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        header {
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .store-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: 900;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px 40px 15px;
        }

        .back-btn {
            display: inline-block;
            background: #f1f2f6;
            color: #2f3542;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }

        /* شبكة المنتجات في الصفحة الرئيسية */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .grid-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .grid-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }

        .grid-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .grid-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .grid-title {
            font-size: 1.1rem;
            color: #2f3542;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .grid-price {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .grid-btn {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            width: 100%;
        }

        /* صفحة تفاصيل المنتج */
        .product-detail-view {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .detail-img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .detail-title {
            font-size: 1.6rem;
            color: #2f3542;
            margin-bottom: 10px;
        }

        .detail-price {
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .detail-desc {
            background: #fff9fa;
            padding: 15px;
            border-radius: 10px;
            color: #57606f;
            margin-bottom: 20px;
            line-height: 1.8;
            border-right: 4px solid var(--primary-color);
        }

        /* لوحة التحكم */
        .admin-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border: 2px dashed var(--primary-color);
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-title {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #2f3542;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eccc68;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #2ed573, #26af5f);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }

        .action-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .social-links {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }

        .social-links a {
            display: inline-block;
            margin: 5px;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .fb { background: #1877f2; }
        .ig { background: #e1306c; }
        .tk { background: #000000; }

        footer {
            text-align: center;
            padding: 20px;
            color: #747d8c;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="announcement">
        📦 التوصيل متوفر لـ 58 ولاية · الدفع عند الاستلام 🤝
    </div>

    <header>
        <div class="logo-area" onclick="showCatalog()">
            <img id="headerLogo" src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?auto=format&fit=crop&w=200&q=80" alt="Logo" class="store-logo">
            <h1 id="headerTitle">Houri Hidaya kids</h1>
        </div>
    </header>

    <div class="container">
        
        <!-- لوحة التحكم الإدارية (تظهر فقط عند إضافة ?admin=true) -->
        <div id="adminPanel" class="admin-panel">
            <h3 class="admin-title">🛠️ لوحة تحكم المسؤول الخاصة بك</h3>
            <div class="form-group">
                <label>رابط اللوجو (صورة الشعار)</label>
                <input type="text" id="adminLogoInput" placeholder="أدخل رابط صورة الشعار">
            </div>
            <div class="form-group">
                <label>اسم المتجر</label>
                <input type="text" id="adminStoreName" value="Houri Hidaya kids">
            </div>
            <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">
            <h4 class="admin-title">إضافة منتج جديد</h4>
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="newTitle" placeholder="مثال: طقم Stitch & Angel للبنات">
            </div>
            <div class="form-group">
                <label>السعر (دج)</label>
                <input type="text" id="newPrice" placeholder="3200 دج">
            </div>
            <div class="form-group">
                <label>رابط صورة المنتج</label>
                <input type="text" id="newImage" placeholder="رابط صورة المنتج المباشر">
            </div>
            <div class="form-group">
                <label>المقاسات (مفصولة بفاصلة)</label>
                <input type="text" id="newSizes" value="2,4,6,8,10 سنوات">
            </div>
            <div class="form-group">
                <label>وصف المنتج التفصيلي</label>
                <textarea id="newDesc" rows="3" placeholder="أدخل الوصف الكامل للمنتج هنا..."></textarea>
            </div>
            <button type="button" class="submit-btn" style="background:#2f3542; margin-bottom: 10px;" onclick="addNewProduct()">إضافة المنتج للمتجر ➕</button>
            <button type="button" class="action-btn" onclick="resetStoreProducts()">إعادة تعيين المنتجات الأصلية
